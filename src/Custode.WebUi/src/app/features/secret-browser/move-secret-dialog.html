<form class="w-full max-w-md rounded-lg border border-border bg-surface-raised p-6 text-text shadow-lg" (submit)="$event.preventDefault(); move()" novalidate>
  <h2 id="move-secret-title" class="text-lg font-semibold">Move {{ secret.name }}</h2>
  <div class="mt-4 flex flex-col gap-1">
    <label for="move-destination" class="text-sm font-medium">Destination folder</label>
    <input
      id="move-destination"
      type="text"
      autocomplete="off"
      [value]="destination()"
      (input)="destination.set($any($event.target).value)"
      (blur)="touched.set(true)"
      class="rounded-md border border-border bg-surface px-3 py-2 font-mono text-text"
    />
    @if (touched() && destinationInvalid()) {
      <p class="text-sm text-danger">Enter a folder path that starts with /.</p>
    }
  </div>
  <div class="mt-6 flex flex-wrap justify-end gap-3">
    <button type="button" class="rounded-md border border-border px-4 py-2 font-medium hover:bg-surface-muted" (click)="cancel()">Cancel</button>
    <button type="submit" class="rounded-md bg-accent px-4 py-2 font-medium text-accent-contrast">Move secret</button>
  </div>
</form>
