<div
  role="dialog"
  aria-modal="true"
  aria-label="Command palette"
  cdkTrapFocus
  cdkTrapFocusAutoCapture
  class="rounded-lg border border-border bg-surface-raised p-3 text-text shadow-lg"
  (keydown.escape)="close()"
>
  <input
    type="search"
    role="combobox"
    aria-label="Search folders, secrets, and actions"
    aria-autocomplete="list"
    aria-expanded="true"
    aria-controls="command-palette-results"
    [attr.aria-activedescendant]="activeId()"
    autocomplete="off"
    [maxLength]="maxQueryLength"
    [value]="query()"
    (input)="onInput($any($event.target).value)"
    (keydown.arrowdown)="$event.preventDefault(); move(1)"
    (keydown.arrowup)="$event.preventDefault(); move(-1)"
    (keydown.enter)="$event.preventDefault(); runActive()"
    placeholder="Search or type a command"
    class="w-full rounded-md border border-border bg-surface px-3 py-2 text-text"
  />

  <div id="command-palette-results" role="listbox" aria-label="Results" class="mt-3 flex max-h-[60vh] flex-col gap-3 overflow-y-auto">
    @for (group of groups(); track group.name) {
      <div role="group" [attr.aria-labelledby]="'palette-group-' + group.name.toLowerCase()">
        <h2 [id]="'palette-group-' + group.name.toLowerCase()" class="px-2 pb-1 text-xs font-semibold uppercase text-text-muted">{{ group.name }}</h2>
        @for (item of group.items; track item.id) {
          <div
            role="option"
            [id]="item.id"
            [attr.aria-selected]="item.id === activeId()"
            class="flex cursor-pointer items-center justify-between gap-3 rounded-md px-2 py-2 text-sm"
            [class.bg-surface-muted]="item.id === activeId()"
            (click)="activeIndex.set(flatItems().indexOf(item)); runActive()"
          >
            <span>{{ item.label }}</span>
            @if (item.detail) {
              <span class="truncate text-text-muted">{{ item.detail }}</span>
            }
          </div>
        }
      </div>
    } @empty {
      <p class="px-2 py-2 text-sm text-text-muted">No matches.</p>
    }
  </div>
</div>
